name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        run: npm ci
      - name: Install backend dependencies for template generation
        run: pip install -r requirements.txt
      - name: Run project checks
        run: |
          python -m unittest discover -v
          npm test
          npm run check:compiler
      - name: Build static application
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
        run: python scripts/build_pages.py --output site
      - name: Save static application artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: site

  deploy:
    if: ${{ vars.API_BASE_URL != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download static application
        uses: actions/download-artifact@v4
        with:
          name: pages-site
          path: site
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
